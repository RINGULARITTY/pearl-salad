# Construit l'image et la publie sur GHCR, sans Docker en local.
# Prerequis : ./build.sh --sync-only (ou .\build.ps1 -SyncOnly) puis commit de vendor/.
#   push sur main  -> ghcr.io/<proprietaire>/pearl-salad:latest
#   tag vX.Y.Z     -> ghcr.io/<proprietaire>/pearl-salad:vX.Y.Z (a utiliser sur Salad : jamais :latest)
name: build-and-push
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vendor present
        run: test -f vendor/pearl_controller.py && test -f vendor/gpus.json
      - name: tests de l'agent
        run: python3 test/test_salad_agent.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: etiquettes
        id: tags
        run: |
          img="ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/pearl-salad"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; else v=latest; fi
          echo "tags=$img:$v" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: IMAGE_VERSION=${{ steps.tags.outputs.version }}
